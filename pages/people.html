<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>People - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .people-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .back-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #111827;
            font-weight: 600;
        }

        /* =========================
           TOP BAR
        ========================= */

        .people-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .people-count {
            color: #6b7280;
            font-size: 14px;
        }

        .add-person-btn {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        /* =========================
           PEOPLE GRID
        ========================= */

        .people-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .person-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .person-top {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .person-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eef2ff;
            font-size: 23px;
            flex-shrink: 0;
        }

        .person-name {
            margin: 0;
            font-size: 19px;
        }

        .person-role {
            margin-top: 4px;
            color: #6b7280;
            font-size: 13px;
        }

        .person-details {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 8px 0;
        }

        .detail-label {
            color: #6b7280;
            font-size: 13px;
        }

        .detail-value {
            font-weight: 600;
            font-size: 14px;
            text-align: right;
            word-break: break-word;
        }

        /* =========================
           STATUS
        ========================= */

        .account-status {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .account-status.active {
            background: #dcfce7;
            color: #166534;
        }

        .account-status.inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        /* =========================
           ACTIONS
        ========================= */

        .person-actions {
            display: flex;
            gap: 9px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .person-action-btn {
            flex: 1;
            border: none;
            border-radius: 8px;
            padding: 9px;
            cursor: pointer;
            font-weight: 600;
        }

        .edit-person {
            background: #eef2ff;
            color: #4338ca;
        }

        .toggle-person {
            background: #f3f4f6;
            color: #374151;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-state {
            text-align: center;
            background: #ffffff;
            border-radius: 14px;
            padding: 60px 20px;
            color: #6b7280;
        }

        /* =========================
           MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            width: min(500px, 100%);
            background: #ffffff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .modal h2 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            border: none;
            padding: 11px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .save-btn {
            background: #111827;
            color: white;
        }

        .cancel-btn {
            background: #f3f4f6;
            color: #111827;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .people-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 650px) {

            .people-page {
                padding: 20px 14px 40px;
            }

            .page-top {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn {
                text-align: center;
            }

            .people-toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .add-person-btn {
                width: 100%;
            }

            .people-grid {
                grid-template-columns: 1fr;
            }

            .person-actions {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="people-page">


    <!-- =====================================
         HEADER
    ====================================== -->

    <div class="page-top">

        <div class="page-title">

            <h1>
                People
            </h1>

            <p>
                Manage the people in your expense group.
            </p>

        </div>


        <a
            href="admin-dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>



    <!-- =====================================
         TOOLBAR
    ====================================== -->

    <div class="people-toolbar">

        <div
            class="people-count"
            id="peopleCountText"
        >
            5 people
        </div>


        <button
            type="button"
            class="add-person-btn"
            onclick="openAddPersonModal()"
        >
            + Add Person
        </button>

    </div>



    <!-- =====================================
         PEOPLE
    ====================================== -->

    <div
        id="peopleGrid"
        class="people-grid"
    ></div>


</div>



<!-- =========================================
     PERSON MODAL
========================================== -->

<div
    id="personModal"
    class="modal-overlay"
>

    <div class="modal">

        <h2 id="modalTitle">
            Add Person
        </h2>


        <form id="personForm">


            <div class="form-group">

                <label for="personName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="personName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="personUsername">
                    Username
                </label>

                <input
                    type="text"
                    id="personUsername"
                    required
                >

            </div>


            <div class="form-group">

                <label for="personPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="personPassword"
                    required
                >

            </div>


            <div class="modal-actions">

                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closePersonModal()"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="save-btn"
                >
                    Save Person
                </button>

            </div>


        </form>

    </div>

</div>


<script src="../js/notifications.js"></script>
<script src="../js/people.js"></script>

</body>

</html>
