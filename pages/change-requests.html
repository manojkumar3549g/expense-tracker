<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change Requests - Expense Tracker</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        .requests-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .back-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #111827;
            font-weight: 600;
        }

        /* FILTERS */

        .filters-card {
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #374151;
            cursor: pointer;
            font-weight: 600;
        }

        .filter-btn.active {
            background: #111827;
            color: #fff;
        }

        /* SUMMARY */

        .request-summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #fff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .summary-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: 700;
        }

        /* REQUEST LIST */

        .requests-container {
            display: grid;
            gap: 18px;
        }

        .request-card {
            background: #fff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .request-title {
            margin: 0;
            font-size: 19px;
        }

        .request-person {
            color: #6b7280;
            margin-top: 5px;
            font-size: 14px;
        }

        /* STATUS */

        .status {
            display: inline-block;
            padding: 6px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status.pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status.approved {
            background: #dcfce7;
            color: #166534;
        }

        .status.rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        /* REQUEST DETAILS */

        .request-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .detail-box {
            background: #f9fafb;
            padding: 13px;
            border-radius: 9px;
        }

        .detail-label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .detail-value {
            font-weight: 600;
            color: #111827;
            word-break: break-word;
        }

        /* REASON */

        .reason-box {
            background: #f9fafb;
            border-radius: 9px;
            padding: 15px;
            margin-bottom: 18px;
        }

        .reason-box strong {
            display: block;
            margin-bottom: 6px;
        }

        .reason-box p {
            margin: 0;
            color: #4b5563;
            line-height: 1.5;
        }

        /* ACTIONS */

        .request-actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }

        .action-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: 700;
        }

        .approve-btn {
            background: #dcfce7;
            color: #166534;
        }

        .reject-btn {
            background: #fee2e2;
            color: #991b1b;
        }

        /* EMPTY */

        .empty-state {
            text-align: center;
            background: #fff;
            border-radius: 14px;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-state h3 {
            color: #111827;
            margin-bottom: 8px;
        }

        /* RESPONSIVE */

        @media (max-width: 900px) {

            .request-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .request-details {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {

            .requests-page {
                padding: 20px 14px 40px;
            }

            .page-top {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn {
                text-align: center;
            }

            .request-summary {
                grid-template-columns: 1fr;
            }

            .request-details {
                grid-template-columns: 1fr;
            }

            .request-header {
                flex-direction: column;
            }

            .request-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="requests-page">

    <!-- HEADER -->

    <div class="page-top">

        <div class="page-title">

            <h1>Change Requests</h1>

            <p>
                Review and manage expense change requests
            </p>

        </div>

        <a
            href="admin-dashboard.html"
            class="back-btn"
        >
            ← Back to Dashboard
        </a>

    </div>


    <!-- FILTER -->

    <div class="filters-card">

        <div class="filters">

            <button
                type="button"
                class="filter-btn active"
                data-filter="all"
            >
                All
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="pending"
            >
                Pending
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="approved"
            >
                Approved
            </button>

            <button
                type="button"
                class="filter-btn"
                data-filter="rejected"
            >
                Rejected
            </button>

        </div>

    </div>


    <!-- SUMMARY -->

    <div class="request-summary">

        <div class="summary-card">

            <div class="summary-label">
                Total Requests
            </div>

            <div
                class="summary-value"
                id="totalRequests"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Pending
            </div>

            <div
                class="summary-value"
                id="pendingRequests"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Approved
            </div>

            <div
                class="summary-value"
                id="approvedRequests"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Rejected
            </div>

            <div
                class="summary-value"
                id="rejectedRequests"
            >
                0
            </div>

        </div>

    </div>


    <!-- REQUESTS -->

    <div
        class="requests-container"
        id="requestsContainer"
    ></div>

</div>

<script src="../js/notifications.js"></script>
<script src="../js/change-requests.js"></script>

</body>
</html>
