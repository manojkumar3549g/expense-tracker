<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Expenses - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .page-container {
            max-width: 1150px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin-bottom: 8px;
        }

        .page-header p {
            color: #666;
        }


        /* ========================================
           SUMMARY
        ======================================== */

        .personal-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }


        .summary-box {
            background: #fff;
            border-radius: 15px;
            padding: 22px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .summary-box p {
            margin: 0 0 8px;
            color: #666;
        }

        .summary-box h2 {
            margin: 0;
            font-size: 25px;
        }


        /* ========================================
           TRANSACTIONS
        ======================================== */

        .transactions-container {
            display: grid;
            gap: 18px;
        }


        .expense-card {
            background: #fff;
            border-radius: 15px;
            padding: 22px;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }


        .expense-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
        }


        .expense-title {
            display: flex;
            gap: 13px;
            align-items: center;
        }


        .expense-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: #f1f5f9;
            font-size: 23px;
            flex-shrink: 0;
        }


        .expense-title h3 {
            margin: 0 0 5px;
        }


        .expense-title p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }


        .expense-total {
            text-align: right;
        }


        .expense-total span {
            display: block;
            color: #777;
            font-size: 13px;
            margin-bottom: 4px;
        }


        .expense-total strong {
            font-size: 19px;
        }

        .top-back-btn {
    margin-top: 15px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #e9ecef;
    color: #333;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
}

.top-back-btn:hover {
    background: #d9dde1;
}


        /* ========================================
           DETAILS
        ======================================== */

        .expense-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid #eee;
        }


        .detail-box {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }


        .detail-box span {
            color: #777;
            font-size: 13px;
        }


        .detail-box strong {
            font-size: 15px;
        }


        /* ========================================
           DETAILS TEXT
        ======================================== */

        .additional-details {
            margin-top: 15px;
            padding: 12px 14px;
            background: #f8f9fa;
            border-radius: 8px;
            color: #555;
            font-size: 14px;
        }


        /* ========================================
           REQUEST BUTTON
        ======================================== */

        .expense-actions {
            margin-top: 18px;
            display: flex;
            justify-content: flex-end;
        }


        .request-btn {
            border: none;
            background: #2878d7;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }


        .request-btn:hover {
            background: #1766c2;
        }


        /* ========================================
           EMPTY
        ======================================== */

        .empty-state {
            background: #fff;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.07);
        }


        .empty-state div {
            font-size: 45px;
            margin-bottom: 12px;
        }


        .empty-state h3 {
            margin-bottom: 8px;
        }


        .empty-state p {
            color: #777;
        }


        /* ========================================
           MOBILE
        ======================================== */

        @media (max-width: 800px) {

            .personal-summary {
                grid-template-columns: 1fr;
            }

            .expense-details {
                grid-template-columns: 1fr;
            }

        }


        @media (max-width: 600px) {

            .page-container {
                margin: 20px auto;
                padding: 0 14px;
            }

            .expense-top {
                flex-direction: column;
            }

            .expense-total {
                text-align: left;
            }

            .expense-actions {
                justify-content: stretch;
            }

            .request-btn {
                width: 100%;
                text-align: center;
            }

        }

    </style>

</head>


<body>


<!-- ========================================
     HEADER
======================================== -->

<header class="dashboard-header">

    <div class="brand">
        💰 Expense Tracker
    </div>


    <div class="user-section">

        <span>

            👤

            <strong id="personName">
                User
            </strong>

        </span>


        <button
            type="button"
            onclick="logout()"
        >
            Logout
        </button>

    </div>

</header>



<!-- ========================================
     MAIN
======================================== -->

<main class="page-container">


    <section class="page-header">

    <h1>
        📊 My Expenses
    </h1>

    <p>
        View all expenses in which you participated.
    </p>

    <button
        type="button"
        class="top-back-btn"
        id="backBtn"
    >
        ← Back to Dashboard
    </button>

</section>



    <!-- ====================================
         SUMMARY
    ===================================== -->

    <section class="personal-summary">


        <div class="summary-box">

            <p>
                My Spent
            </p>

            <h2 id="mySpent">
                ₹0.00
            </h2>

        </div>


        <div class="summary-box">

            <p>
                My Given
            </p>

            <h2 id="myGiven">
                ₹0.00
            </h2>

        </div>


        <div class="summary-box">

            <p>
                My Expenses
            </p>

            <h2 id="myExpenseCount">
                0
            </h2>

        </div>


    </section>



    <!-- ====================================
         TRANSACTIONS
    ===================================== -->

    <section>

        <div class="section-header">

            <h2>
                My Transactions
            </h2>

            <span id="transactionStatus">
                0 transactions
            </span>

        </div>


        <div
            id="expenseList"
            class="transactions-container"
        ></div>

    </section>


</main>


<script src="../js/notifications.js"></script>
<script src="../js/personal-expenses.js"></script>


</body>

</html>
