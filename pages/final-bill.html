<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Final Bill - Expense Tracker</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .bill-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* =========================
           TOP
        ========================= */

        .bill-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .bill-title h1 {
            margin: 0;
            font-size: 30px;
        }

        .bill-title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .bill-actions {
            display: flex;
            gap: 10px;
        }

        .bill-btn {
            border: none;
            border-radius: 8px;
            padding: 11px 17px;
            cursor: pointer;
            font-weight: 600;
        }

        .back-btn {
            background: #f3f4f6;
            color: #111827;
        }

        .print-btn {
            background: #111827;
            color: #ffffff;
        }

        /* =========================
           BILL
        ========================= */

        .bill-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .bill-header {
            text-align: center;
            padding-bottom: 25px;
            border-bottom: 2px solid #e5e7eb;
        }

        .bill-logo {
            font-size: 35px;
            margin-bottom: 5px;
        }

        .bill-header h2 {
            margin: 0;
            font-size: 26px;
        }

        .bill-header p {
            margin: 7px 0 0;
            color: #6b7280;
        }

        /* =========================
           SUMMARY
        ========================= */

        .bill-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 25px 0;
        }

        .bill-summary-card {
            background: #f9fafb;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }

        .bill-summary-label {
            color: #6b7280;
            font-size: 13px;
        }

        .bill-summary-value {
            font-size: 23px;
            font-weight: 700;
            margin-top: 5px;
        }

        /* =========================
           PERSON SUMMARY
        ========================= */

        .section-title {
            margin: 30px 0 15px;
            font-size: 20px;
        }

        .person-summary {
            display: grid;
            grid-template-columns:
                repeat(5, minmax(0, 1fr));
            gap: 12px;
        }

        .person-bill-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
        }

        .person-bill-name {
            font-weight: 700;
            margin-bottom: 12px;
        }

        .person-stat {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            padding: 5px 0;
        }

        .person-stat-label {
            color: #6b7280;
        }

        .person-stat-value {
            font-weight: 600;
        }

        /* =========================
           EXPENSE TABLE
        ========================= */

        .expense-table-wrapper {
            overflow-x: auto;
        }

        .expense-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 700px;
        }

        .expense-table th,
        .expense-table td {
            padding: 13px 10px;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
            vertical-align: top;
        }

        .expense-table th {
            background: #f9fafb;
            font-size: 13px;
        }

        .expense-table td {
            font-size: 14px;
        }

        .expense-name {
            font-weight: 700;
        }

        .expense-category {
            color: #6b7280;
            font-size: 12px;
        }

        .split-list {
            display: grid;
            gap: 3px;
        }

        .split-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            font-size: 12px;
        }

        /* =========================
           EMPTY
        ========================= */

        .empty-bill {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .empty-bill h3 {
            color: #111827;
        }

        /* =========================
           PRINT
        ========================= */

        @media print {

            body {
                background: #ffffff !important;
            }

            .bill-page {
                max-width: none;
                padding: 0;
            }

            .bill-top {
                display: none;
            }

            .bill-container {
                box-shadow: none;
                padding: 0;
            }

        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .person-summary {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }

        @media (max-width: 650px) {

            .bill-page {
                padding: 20px 12px 40px;
            }

            .bill-top {
                flex-direction: column;
                align-items: stretch;
            }

            .bill-actions {
                flex-direction: column;
            }

            .bill-btn {
                width: 100%;
            }

            .bill-container {
                padding: 20px 15px;
            }

            .bill-summary {
                grid-template-columns: 1fr;
            }

            .person-summary {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="bill-page">


    <!-- =====================================
         PAGE TOP
    ====================================== -->

    <div class="bill-top">

        <div class="bill-title">

            <h1>
                Final Bill
            </h1>

            <p>
                Complete expense summary
            </p>

        </div>


        <div class="bill-actions">

            <button
                type="button"
                class="bill-btn back-btn"
                id="backBtn"
            >
                ← Back
            </button>


            <button
                type="button"
                class="bill-btn print-btn"
                onclick="window.print()"
            >
                🖨️ Print / Save PDF
            </button>

        </div>

    </div>



    <!-- =====================================
         BILL
    ====================================== -->

    <div class="bill-container">


        <!-- BILL HEADER -->

        <div class="bill-header">

            <div class="bill-logo">
                💰
            </div>

            <h2>
                Expense Tracker
            </h2>

            <p>
                Final Expense Summary
            </p>

        </div>



        <!-- SUMMARY -->

        <div class="bill-summary">


            <div class="bill-summary-card">

                <div class="bill-summary-label">
                    Total Expenses
                </div>

                <div
                    class="bill-summary-value"
                    id="totalExpenses"
                >
                    0
                </div>

            </div>


            <div class="bill-summary-card">

                <div class="bill-summary-label">
                    Total Amount
                </div>

                <div
                    class="bill-summary-value"
                    id="grandTotal"
                >
                    ₹0.00
                </div>

            </div>


            <div class="bill-summary-card">

                <div class="bill-summary-label">
                    People
                </div>

                <div
                    class="bill-summary-value"
                    id="totalPeople"
                >
                    5
                </div>

            </div>

        </div>



        <!-- PERSON SUMMARY -->

        <h3 class="section-title">
            Person Summary
        </h3>


        <div
            id="personSummary"
            class="person-summary"
        ></div>



        <!-- EXPENSE DETAILS -->

        <h3 class="section-title">
            Expense Details
        </h3>


        <div class="expense-table-wrapper">

            <table class="expense-table">

                <thead>

                    <tr>

                        <th>
                            Date
                        </th>

                        <th>
                            Expense
                        </th>

                        <th>
                            Spent By
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Amount Given
                        </th>

                    </tr>

                </thead>


                <tbody id="expenseTableBody">

                </tbody>

            </table>

        </div>


    </div>

</div>


<script src="../js/notifications.js"></script>
<script src="../js/final-bill.js"></script>

</body>

</html>
