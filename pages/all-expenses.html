<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>All Expenses - Expense Tracker</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>
        /* =========================
           PAGE
        ========================= */

        .expenses-page {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px 50px;
        }

        .page-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .page-title h1 {
            margin: 0;
            font-size: 30px;
        }

        .page-title p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .back-btn {
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            background: #f3f4f6;
            color: #111827;
            font-weight: 600;
        }

        /* =========================
           FILTERS
        ========================= */

        .filters-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .filters {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: #374151;
        }

        .filter-group input,
        .filter-group select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .clear-btn {
            padding: 11px 18px;
            border: none;
            border-radius: 8px;
            background: #e5e7eb;
            color: #111827;
            cursor: pointer;
            font-weight: 600;
        }

        /* =========================
           SUMMARY
        ========================= */

        .expense-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #ffffff;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .summary-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .summary-value {
            font-size: 25px;
            font-weight: 700;
            color: #111827;
        }

        /* =========================
           EXPENSE LIST
        ========================= */

        .expenses-container {
            display: grid;
            gap: 18px;
        }

        .expense-card {
            background: #ffffff;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        .expense-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 18px;
        }

        .expense-title {
            margin: 0;
            font-size: 20px;
            color: #111827;
        }

        .expense-category {
            display: inline-block;
            margin-top: 6px;
            padding: 5px 10px;
            border-radius: 20px;
            background: #eef2ff;
            color: #4338ca;
            font-size: 12px;
            font-weight: 600;
        }

        .expense-total {
            font-size: 23px;
            font-weight: 700;
            white-space: nowrap;
        }

        .expense-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .info-box {
            background: #f9fafb;
            padding: 12px;
            border-radius: 9px;
        }

        .info-label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .info-value {
            font-weight: 600;
            color: #111827;
        }

        /* =========================
           SPLIT
        ========================= */

        .split-section {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
        }

        .split-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .split-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .split-person {
            background: #f9fafb;
            padding: 10px;
            border-radius: 8px;
        }

        .split-person-name {
            display: block;
            font-size: 12px;
            color: #6b7280;
        }

        .split-person-amount {
            font-weight: 700;
            margin-top: 4px;
        }

        /* =========================
           DETAILS
        ========================= */

        .expense-details {
            margin-top: 15px;
            color: #4b5563;
            font-size: 14px;
        }

        /* =========================
           ACTIONS
        ========================= */

        .expense-actions {
            display: flex;
            gap: 10px;
            margin-top: 18px;
            padding-top: 16px;
            border-top: 1px solid #e5e7eb;
        }

        .action-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 600;
        }

        .edit-btn {
            background: #eef2ff;
            color: #4338ca;
        }

        .delete-btn {
            background: #fee2e2;
            color: #b91c1c;
        }

        .request-btn {
            background: #fff7ed;
            color: #c2410c;
        }

        /* =========================
           EMPTY STATE
        ========================= */

        .empty-state {
            text-align: center;
            background: #ffffff;
            padding: 60px 20px;
            border-radius: 14px;
            color: #6b7280;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: #111827;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .filters {
                grid-template-columns: 1fr 1fr;
            }

            .expense-summary {
                grid-template-columns: 1fr;
            }

            .split-list {
                grid-template-columns: repeat(3, 1fr);
            }

        }

        @media (max-width: 650px) {

            .expenses-page {
                padding: 20px 14px 40px;
            }

            .page-top {
                flex-direction: column;
                align-items: stretch;
            }

            .back-btn {
                text-align: center;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .expense-header {
                flex-direction: column;
            }

            .expense-info {
                grid-template-columns: 1fr;
            }

            .split-list {
                grid-template-columns: repeat(2, 1fr);
            }

            .expense-actions {
                flex-direction: column;
            }

            .action-btn {
                width: 100%;
            }

        }

        @media (max-width: 400px) {

            .split-list {
                grid-template-columns: 1fr;
            }

            .expense-card {
                padding: 16px;
            }

        }
    </style>
</head>

<body>

<div class="expenses-page">

    <!-- =========================
         PAGE HEADER
    ========================== -->

    <div class="page-top">

        <div class="page-title">
            <h1>All Expenses</h1>
            <p>View and manage recorded expenses</p>
        </div>

        <a href="#" id="backBtn" class="back-btn">
            ← Back
        </a>

    </div>


    <!-- =========================
         FILTERS
    ========================== -->

    <div class="filters-card">

        <div class="filters">

            <div class="filter-group">

                <label for="searchInput">
                    Search
                </label>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search expense name..."
                >

            </div>


            <div class="filter-group">

                <label for="categoryFilter">
                    Category
                </label>

                <select id="categoryFilter">

                    <option value="all">
                        All Categories
                    </option>

                    <option value="Bus">Bus</option>
                    <option value="Auto">Auto</option>
                    <option value="Theatre">Theatre</option>
                    <option value="Lunch">Lunch</option>
                    <option value="Dinner">Dinner</option>
                    <option value="Snacks">Snacks</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Movie">Movie</option>
                    <option value="Others">Others</option>

                </select>

            </div>


            <div class="filter-group">

                <label for="dateFilter">
                    Date
                </label>

                <input
                    type="date"
                    id="dateFilter"
                >

            </div>


            <button
                type="button"
                class="clear-btn"
                id="clearFilters"
            >
                Clear
            </button>

        </div>

    </div>


    <!-- =========================
         SUMMARY
    ========================== -->

    <div class="expense-summary">

        <div class="summary-card">

            <div class="summary-label">
                Expenses Shown
            </div>

            <div
                class="summary-value"
                id="expenseCount"
            >
                0
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Total Amount
            </div>

            <div
                class="summary-value"
                id="totalAmount"
            >
                ₹0.00
            </div>

        </div>


        <div class="summary-card">

            <div class="summary-label">
                Your Given Amount
            </div>

            <div
                class="summary-value"
                id="yourGiven"
            >
                ₹0.00
            </div>

        </div>

    </div>


    <!-- =========================
         EXPENSES
    ========================== -->

    <div
        class="expenses-container"
        id="expensesContainer"
    ></div>

</div>

<script src="../js/notifications.js"></script>
<script src="../js/all-expenses.js"></script>

</body>
</html>
