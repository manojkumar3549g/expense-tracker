
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker Setup</title>
</head>
<body>
  <h2>Initialize Expense Tracker Accounts</h2>
  <p>Run this once to create the six accounts in your database.</p>

  <form id="setupForm">
    <label>Setup Secret</label><br>
    <input id="secret" type="password" required autocomplete="off"><br><br>

    <label>Admin password (minimum 12 characters)</label><br>
    <input id="admin" type="password" minlength="12" required><br><br>

    <label>Vetrivel password</label><br>
    <input id="vetri" type="password" minlength="12" required><br><br>

    <label>Nitheen password</label><br>
    <input id="nitheen" type="password" minlength="12" required><br><br>

    <label>Yaswanth password</label><br>
    <input id="yash" type="password" minlength="12" required><br><br>

    <label>Dharshini password</label><br>
    <input id="dharshu" type="password" minlength="12" required><br><br>

    <label>ManojKumar password</label><br>
    <input id="mano" type="password" minlength="12" required><br><br>

    <button type="submit">Create Accounts</button>
  </form>

  <pre id="result"></pre>

  <script>
    const API = "https://expense-tracker-api.manojkumar3549g.workers.dev";

    document.getElementById("setupForm").addEventListener("submit", async (event) => {
      event.preventDefault();

      const result = document.getElementById("result");
      result.textContent = "Creating accounts...";

      const passwords = {};
      ["admin", "vetri", "nitheen", "yash", "dharshu", "mano"].forEach(id => {
        passwords[id] = document.getElementById(id).value;
      });

      try {
        const response = await fetch(`${API}/api/setup`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Setup-Secret": document.getElementById("secret").value
          },
          body: JSON.stringify({ passwords })
        });

        const data = await response.json();
        result.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent = "Request failed. Check the API deployment and browser console.";
      }
    });
  </script>
</body>
</html>
